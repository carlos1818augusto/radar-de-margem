name: Reproduzir e testar
on: [push, pull_request]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s tests -v
      - run: node tests/test_scenario.js
      - run: python radar.py
      - run: git diff --exit-code -- demo
